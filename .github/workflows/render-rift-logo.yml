name: Render RIFT logo PNG

on:
  push:
    branches:
      - copilot/rift-logo-transfer
    paths:
      - 'branding/rift-logo.svg'
      - '.github/workflows/render-rift-logo.yml'

permissions:
  contents: write

jobs:
  render-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out asset branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render transparent PNG from the original SVG
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir cairosvg
          python - <<'PY'
          import cairosvg
          cairosvg.svg2png(
              url="branding/rift-logo.svg",
              write_to="branding/rift-logo-transparent.png",
              output_width=1000,
              output_height=1000,
          )
          PY
      - name: Commit only the generated PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add branding/rift-logo-transparent.png
          git commit -m "Add transparent RIFT logo PNG"
          git push origin "HEAD:${GITHUB_REF_NAME}"
