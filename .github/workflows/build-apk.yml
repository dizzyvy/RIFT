name: Build debug APK

on:
  pull_request:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-pull-request:
    if: github.event_name == 'pull_request'
    name: Test and build debug APK
    uses: ./.github/workflows/android-build.yml
    with:
      signing_enabled: false
    permissions:
      contents: read

  build-trusted:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    name: Test and build signed debug APK
    uses: ./.github/workflows/android-build.yml
    with:
      signing_enabled: true
    secrets:
      RIFT_SIGNING_KEYSTORE_BASE64: ${{ secrets.RIFT_SIGNING_KEYSTORE_BASE64 }}
      RIFT_SIGNING_KEYSTORE_PASSWORD: ${{ secrets.RIFT_SIGNING_KEYSTORE_PASSWORD }}
    permissions:
      contents: read

  prerelease:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-trusted
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: app-debug-apk

      - name: Prepare prerelease APK
        run: mv app-debug.apk "RIFT-${GITHUB_REF_NAME}-debug.apk"

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          name: RIFT ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: true
          files: RIFT-${{ github.ref_name }}-debug.apk
