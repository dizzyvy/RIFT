name: Build debug APK

on:
  pull_request:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-pull-request:
    if: github.event_name == 'pull_request'
    name: Test and build debug APK
    uses: ./.github/workflows/android-build.yml
    with:
      signing_enabled: false
    permissions:
      contents: read

  build-trusted:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    name: Test and build signed debug APK
    uses: ./.github/workflows/android-build.yml
    with:
      signing_enabled: true
    secrets:
      RIFT_SIGNING_KEYSTORE_BASE64: ${{ secrets.RIFT_SIGNING_KEYSTORE_BASE64 }}
      RIFT_SIGNING_KEYSTORE_PASSWORD: ${{ secrets.RIFT_SIGNING_KEYSTORE_PASSWORD }}
    permissions:
      contents: read

  prerelease:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-trusted
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: app-debug-apk

      - name: Prepare release APK
        id: apk
        run: |
          if [[ "$GITHUB_REF_NAME" == "v0.12.0" ]]; then
            filename="RIFT-${GITHUB_REF_NAME}.apk"
          else
            filename="RIFT-${GITHUB_REF_NAME}-debug.apk"
          fi
          mv app-debug.apk "$filename"
          echo "filename=$filename" >> "$GITHUB_OUTPUT"

      - name: Remove outdated v0.12.0 APK asset
        if: github.ref_name == 'v0.12.0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" --jq '.id')"
          asset_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets" \
            --jq '.[] | select(.name == "RIFT-v0.12.0-debug.apk") | .id')"
          if [[ -n "$asset_id" ]]; then
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: RIFT ${{ github.ref_name }}
          prerelease: ${{ github.ref_name != 'v0.12.0' }}
          generate_release_notes: true
          files: ${{ steps.apk.outputs.filename }}
